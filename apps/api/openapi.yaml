components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-sandbox-token
  responses:
    ApiError:
      description: API error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    type: string
  schemas:
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          example: demo@lousa.app
        password:
          type: string
          example: Lousa2026
    LoginResponse:
      type: object
      required:
      - user
      - accessToken
      - refreshToken
      - demo
      properties:
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
              format: email
            name:
              type: string
        accessToken:
          type: string
        refreshToken:
          type: string
        demo:
          type: boolean
          example: true
    PeriodRecordInput:
      type: object
      required:
      - startDate
      properties:
        id:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        confirmed:
          type: boolean
        flowByDay:
          type: object
          additionalProperties:
            type: string
        painByDay:
          type: object
          additionalProperties:
            type: number
        productsUsedByDay:
          type: object
          additionalProperties:
            type: number
        nightLeakageByDay:
          type: object
          additionalProperties:
            type: boolean
    PeriodRecord:
      allOf:
      - $ref: '#/components/schemas/PeriodRecordInput'
      - type: object
        required:
        - id
        - source
        - createdAt
        - updatedAt
        properties:
          source:
            type: string
            enum:
            - user
            - imported
            - legacy
            - demo
          needsReview:
            type: boolean
          createdAt:
            type: string
            format: date-time
          updatedAt:
            type: string
            format: date-time
    CyclePrediction:
      type: object
      properties:
        mostLikelyStart:
          type: string
          format: date
          nullable: true
        earliestStart:
          type: string
          format: date
          nullable: true
        latestStart:
          type: string
          format: date
          nullable: true
        confidence:
          type: string
          enum:
          - insufficient
          - low
          - medium
          - high
        confidenceScore:
          type: number
        reasons:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        isCalendarEstimateOnly:
          type: boolean
          example: true
    CycleObservation:
      type: object
      required:
      - date
      - type
      properties:
        id:
          type: string
        date:
          type: string
          format: date
        type:
          type: string
          enum:
          - period_start
          - period_day
          - period_end
          - spotting
          - no_bleeding
        source:
          type: string
          enum:
          - user
          - imported
        periodRecordId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DeliveryAddress:
      type: object
      required:
      - street
      - house
      - latitude
      - longitude
      - formattedAddress
      properties:
        id:
          type: string
        label:
          type: string
          enum:
          - home
          - work
          - other
        addressType:
          type: string
          enum:
          - apartment
          - private_house
          - office
          - workplace
          - hotel
          - other
        handoffType:
          type: string
          enum:
          - hand_to_recipient
          - leave_at_door
          - leave_with_reception
          - leave_with_security
          - call_on_arrival
          - other
        country:
          type: string
        region:
          type: string
        city:
          type: string
        district:
          type: string
        street:
          type: string
        house:
          type: string
        entrance:
          type: string
        floor:
          type: string
        apartment:
          type: string
        postalCode:
          type: string
        intercomCode:
          type: string
        instructions:
          type: string
        companyName:
          type: string
        contactPerson:
          type: string
        officeNumber:
          type: string
        hotelName:
          type: string
        roomNumber:
          type: string
        landmark:
          type: string
        gateDetails:
          type: string
        leaveAtDoorLocation:
          type: string
        callOnArrival:
          type: boolean
        doNotKnock:
          type: boolean
        photoConfirmation:
          type: boolean
        recipientName:
          type: string
        phone:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        formattedAddress:
          type: string
        provider:
          type: string
          enum:
          - google
          - maptiler
          - device
          - manual
        providerPlaceId:
          type: string
          nullable: true
        deliveryZoneId:
          type: string
          nullable: true
        deliveryFeeMinor:
          type: integer
          nullable: true
        estimatedMinutes:
          type: integer
          nullable: true
        validationStatus:
          type: string
          enum:
          - unverified
          - verified
          - outside_zone
        deliveryIncludedInPlan:
          type: boolean
          example: true
        planCode:
          type: string
          nullable: true
        zoneVerifiedAt:
          type: string
          format: date-time
          nullable: true
        syncStatus:
          type: string
          enum:
          - synced
          - pending
          - failed
        isDefault:
          type: boolean
    PaymentIntent:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        amountMinor:
          type: integer
        currency:
          type: string
          example: AMD
        status:
          type: string
        demo:
          type: boolean
          example: true
